server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # VitePress 產生 .html 檔；網址不帶副檔名時補上
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 雜湊檔名的靜態資源可長期快取
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
